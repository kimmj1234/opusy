<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 프로필 · OPUSY</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="login.css?v=202611191900">
  <link rel="stylesheet" href="profile.css?v=202611191900">
  <script>
    // 메뉴바 크기를 메인 페이지와 똑같이: 1920×1080 기준 배율
    const fit = () => document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
    fit(); addEventListener('resize', fit);
  </script>
</head>
<body>
  <header id="menubar" data-theme="light">
    <a class="logo" href="index.html" aria-label="OPUSY 홈"></a>

    <div class="menu-right">
      <!-- 기능 목록: 끌어다가 흰 상자에 놓으면 그 자리에 펼쳐짐 (눌러서 자리를 고를 수도 있음) -->
      <div class="pf-tools" id="pfTools" role="group">
        <button type="button" class="pf-tool" data-w="profile" data-i18n="wProfile"></button>
        <button type="button" class="pf-tool" data-w="devices" data-i18n="devices"></button>
        <button type="button" class="pf-tool" data-w="activity" data-i18n="wActivity"></button>
        <!-- 끌지 않고 누르기만 했을 때 잠깐 뜨는 안내 -->
        <p class="pf-tools-hint" id="pfToolsHint" role="status" data-i18n="dragHint"></p>
      </div>
      <div class="lang" role="group" aria-label="언어 선택">
        <button type="button" data-lang="ko" class="active">KR</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lang="en">ENG</button>
      </div>

      <a class="login" href="login.html" aria-label="login">
        <!-- 로고와 같은 선(stroke) 스타일로 그린 'login' -->
        <svg viewBox="-47 -47 494 187" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter" aria-hidden="true">
          <g transform="translate(100 0)">
          <path d="M0 -40V60"/>
          <circle cx="60" cy="30" r="30"/>
          <circle cx="150" cy="30" r="30"/>
          <path d="M180 0V70A30 30 0 0 1 120 70"/>
          <path d="M210 0V60"/>
          <path d="M210 -40V-26"/>
          <path d="M240 60V30A30 30 0 0 1 300 30V60"/>
          </g>
        </svg>
      </a>
      <div class="user" id="user" hidden>
        <button type="button" class="user-name" id="userName" aria-haspopup="true" aria-expanded="false"></button>
        <div class="user-menu" id="userMenu">
          <button type="button" id="menuProfile" data-i18n="profile">내 프로필</button>
          <button type="button" id="menuSettings" data-i18n="settings">설정</button>
          <button type="button" id="logout" data-i18n="logout">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 내 프로필: 메뉴바 아래 흰 상자 하나. 지금은 '이전으로 돌아가기'만 있음 -->
  <main class="auth pf-page">
    <div class="pf-panel">
      <a class="back-link" href="index.html" id="goBack"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-i18n="goBack"></span></a>

      <!-- 흰 상자를 가운데 기준으로 네 등분: 처음 배치는 왼쪽 위 = 프로필 카드, 오른쪽 위 = 등록된 기기, 왼쪽 아래 = 활동. 메뉴바의 기능을 끌어다 놓아 바꿀 수 있음 -->
      <div class="pf-grid is-wait" id="pfGrid">
      <section class="pf-q pf-q1" data-w="profile" data-slot="tl">
      <!-- 프로필 카드: 위에 커버(회색 배경과 같은 색), 커버 아래쪽에 걸친 프로필 동그라미, 아이디·이메일, 구분선, 계정 정보 -->
      <div class="pf-card is-loading" id="pfTop">
        <div class="pf-cover">
          <!-- 배경 사진: 누르면 바꿀 수 있음. 없을 때는 바깥 회색 배경과 같은 색 -->
          <button type="button" class="pf-banner" id="pfCover">
            <img id="pfCoverImg" alt="" hidden>
            <span class="pf-banner-empty" id="pfCoverEmpty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-4.5-4.5L8 20"/></svg>
              <span data-i18n="addCover"></span>
            </span>
            <span class="pf-banner-hover" data-i18n="changeCover" aria-hidden="true"></span>
          </button>
          <input type="file" id="pfCoverFile" accept="image/*" hidden>
          <!-- 배경 사진 안내: 작은 동그라미 안의 느낌표를 누르면 말풍선이 열림 -->
          <div class="pf-tip pf-tip-cover">
            <button type="button" class="pf-tip-btn" id="pfTipCover" aria-expanded="false" aria-controls="pfTipCoverBubble">!</button>
            <div class="pf-tip-bubble" id="pfTipCoverBubble" role="note" hidden>
              <strong data-i18n="tipCoverT"></strong>
              <ul><li data-i18n="tipCoverSize"></li><li data-i18n="tipCoverFit"></li><li data-i18n="tipMax"></li><li data-i18n="tipFormat"></li></ul>
            </div>
          </div>
          <!-- 프로필 동그라미: 배경 사진 아래쪽 가장자리에 반쯤 걸침 -->
          <div class="pf-photo-box" id="pfPhotoBox">
            <button type="button" class="pf-photo" id="pfPhoto">
              <img id="pfPhotoImg" alt="" hidden>
              <span class="pf-photo-empty" id="pfPhotoEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.2"/></svg>
                <span data-i18n="addPhoto"></span>
              </span>
              <span class="pf-photo-hover" data-i18n="changePhoto" aria-hidden="true"></span>
            </button>
            <input type="file" id="pfFile" accept="image/*" hidden>
            <!-- 프로필 사진 안내 -->
            <div class="pf-tip pf-tip-photo">
              <button type="button" class="pf-tip-btn" id="pfTipPhoto" aria-expanded="false" aria-controls="pfTipPhotoBubble">!</button>
              <div class="pf-tip-bubble" id="pfTipPhotoBubble" role="note" hidden>
                <strong data-i18n="tipPhotoT"></strong>
                <ul><li data-i18n="tipPhotoSize"></li><li data-i18n="tipPhotoFit"></li><li data-i18n="tipMax"></li><li data-i18n="tipFormat"></li></ul>
              </div>
            </div>
          </div>
        </div>
        <div class="pf-head">
          <div class="pf-who">
            <h2 class="pf-id" id="pfId"></h2>
            <p class="pf-email" id="pfEmail"></p>
          </div>
          <div class="pf-actions">
            <div class="pf-pills">
              <button class="pf-pill" type="button" id="pfCoverRemove" data-i18n="removeCover" hidden></button>
              <button class="pf-pill" type="button" id="pfRemove" data-i18n="removePhoto" hidden></button>
            </div>
            <p class="msg" id="pfMsg" role="status"></p>
          </div>
        </div>
        <!-- 게시글·팔로워·팔로우·좋아요: 하나를 고르면 왼쪽 아래 칸에 그 자세한 내용이 나옴 -->
        <!-- 아래 줄: 숫자 네 개 + (칸이 넓거나 길 때만 보이는) 계정 정보 -->
        <div class="pf-bottom">
        <div class="pf-stats" role="tablist" id="pfTabs">
          <button type="button" class="pf-stat is-on" role="tab" id="tabPosts" data-view="posts" aria-selected="true" aria-controls="pfDetail"><b id="pfStatPosts">0</b><span data-i18n="posts"></span></button>
          <button type="button" class="pf-stat" role="tab" id="tabFollowers" data-view="followers" aria-selected="false" aria-controls="pfDetail" tabindex="-1"><b id="pfStatFollowers">0</b><span data-i18n="followers"></span></button>
          <button type="button" class="pf-stat" role="tab" id="tabFollowing" data-view="following" aria-selected="false" aria-controls="pfDetail" tabindex="-1"><b id="pfStatFollowing">0</b><span data-i18n="following"></span></button>
          <button type="button" class="pf-stat" role="tab" id="tabLikes" data-view="likes" aria-selected="false" aria-controls="pfDetail" tabindex="-1"><b id="pfStatLikes">0</b><span data-i18n="likes"></span></button>
        </div>
        <dl class="pf-info" id="pfInfo">
          <div><dt data-i18n="iName"></dt><dd id="pfName">–</dd></div>
          <div><dt data-i18n="iBirth"></dt><dd id="pfBirth">–</dd></div>
          <div><dt data-i18n="iPhone"></dt><dd id="pfPhone">–</dd></div>
          <div><dt data-i18n="iJoined"></dt><dd id="pfJoined">–</dd></div>
        </dl>
        </div>
      </div>
      <!-- 프로필을 전체 화면에 놓았을 때만 보이는 내용: 왼쪽 ①소개 ②분야·경력·태그 ③계정 정보·완성도, 오른쪽 ④최근 게시글 ⑤활동 기록 ⑥팔로워 -->
      <div class="pf-extra" id="pfExtra">
        <div class="pf-x-col">
          <section class="pf-x-box is-grow" id="pfXAbout">
            <h3 class="pf-x-t"><span data-i18n="xAbout"></span><button type="button" class="pf-x-edit" data-focus="headline" data-i18n="eEdit"></button></h3>
            <p class="pf-x-headline" id="pfXHeadline"></p>
            <p class="pf-x-bio" id="pfXBio"></p>
          </section>
          <section class="pf-x-box" data-drop="2">
            <h3 class="pf-x-t"><span data-i18n="xField"></span><button type="button" class="pf-x-edit" data-focus="field" data-i18n="eEdit"></button></h3>
            <p class="pf-x-field" id="pfXField"></p>
            <div class="pf-x-tags" id="pfXTags"></div>
          </section>
          <section class="pf-x-box">
            <h3 class="pf-x-t" data-i18n="xAccount"></h3>
            <dl class="pf-x-info" id="pfXInfo"></dl>
            <div class="pf-x-done"><span id="pfXDoneTxt"></span><u><i id="pfXDoneBar"></i></u></div>
          </section>
        </div>
        <div class="pf-x-col">
          <section class="pf-x-box is-grow" id="pfXRecent">
            <h3 class="pf-x-t" data-i18n="xRecent"></h3>
            <div class="pf-x-posts" id="pfXPosts"></div>
          </section>
          <section class="pf-x-box is-grow is-heat" id="pfXActivity">
            <h3 class="pf-x-t"><span data-i18n="xActivity"></span><small id="pfXActSum"></small></h3>
            <div class="pf-x-heat" id="pfXHeat" role="img"></div>
          </section>
          <section class="pf-x-box" data-drop="1">
            <h3 class="pf-x-t" data-i18n="xFollowers"></h3>
            <div class="pf-x-fans" id="pfXFans"></div>
          </section>
        </div>
      </div>
      </section>

      <!-- 오른쪽 위: 이 계정에 등록된 기기 (보기만) -->
      <section class="pf-q pf-q2" data-w="devices" data-slot="tr">
        <div class="pf-dev is-loading" id="pfDev">
          <h2 class="pf-q-title"><span data-i18n="devices"></span><span class="pf-count" id="pfDevCount"></span><span class="pf-dev-sum" id="pfDevSum"></span></h2>
          <div class="pf-dev-main">
          <ul class="pf-dev-list" id="pfDevList"></ul>
          <p class="pf-dev-note" id="pfDevNote" role="status"></p>
          <!-- 한 쪽에 기기 3대씩: 이전 페이지 · 기기 추가 · 다음 페이지.
               안내가 생기면 버튼이 아래로 내려가 사라지고 그 자리에 글이 3초 동안 떠 있다가, 글이 사라지면 버튼이 다시 올라옴 -->
          <div class="pf-dev-foot" id="pfDevFoot">
            <div class="pf-dev-nav">
              <button type="button" class="pf-dev-navbtn" id="pfDevPrev" data-i18n="devPrev" disabled></button>
              <button type="button" class="pf-dev-navbtn is-add" id="pfDevAdd" data-i18n="devAdd"></button>
              <button type="button" class="pf-dev-navbtn" id="pfDevNext" data-i18n="devNext" disabled></button>
            </div>
            <p class="pf-dev-toast" id="pfDevToast" role="status" aria-live="polite"></p>
          </div>
          </div>
          <!-- 전체 화면일 때만: 고른 기기의 자세한 정보와 접속 기록 -->
          <aside class="pf-dev-detail" id="pfDevDetail" aria-live="polite"></aside>
        </div>
      </section>

      <!-- 왼쪽 아래: 위에서 고른 항목의 자세한 내용. 아래쪽은 '이전으로 돌아가기' 자리라 비워 둠 -->
      <section class="pf-q pf-q3 has-back" data-w="activity" data-slot="bl" id="pfDetail" role="tabpanel" aria-labelledby="tabPosts" aria-live="polite">
        <div class="pf-d-head">
          <h2 class="pf-q-title" id="pfDetailTitle"></h2>
          <div class="pf-seg" id="pfSeg" role="group" hidden>
            <button type="button" class="pf-seg-btn is-on" data-dir="received" data-i18n="segRecv"></button>
            <button type="button" class="pf-seg-btn" data-dir="given" data-i18n="segGave"></button>
          </div>
        </div>
        <div class="pf-d-body" id="pfDetailBody"></div>
      </section>
      <!-- 가운데 십자 선 (네 토막): 기능이 두 칸 이상을 차지하면 그 사이 토막은 숨김 -->
      <i class="pf-line pf-line-vt" aria-hidden="true"></i><i class="pf-line pf-line-vb" aria-hidden="true"></i>
      <i class="pf-line pf-line-hl" aria-hidden="true"></i><i class="pf-line pf-line-hr" aria-hidden="true"></i>
      </div>

      <!-- 배치 모양 고르기: 기능을 끌기 시작하면 흰 상자가 흐려지고 가운데에 놓을 수 있는 모양이 나타남 -->
      <div class="pf-pick" id="pfPick" role="dialog" aria-modal="true" aria-labelledby="pfPickTitle" hidden>
        <div class="pf-pick-in">
          <h2 class="pf-pick-title" id="pfPickTitle"></h2>
          <!-- 네 칸 중 한 칸 (조금 크게) -->
          <div class="pf-pick-quad">
            <button type="button" class="pf-zone" data-slot="tl"></button>
            <button type="button" class="pf-zone" data-slot="tr"></button>
            <button type="button" class="pf-zone" data-slot="bl"></button>
            <button type="button" class="pf-zone" data-slot="br"></button>
          </div>
          <!-- 기본 크기: 가로(위·아래 절반) · 세로(왼쪽·오른쪽 절반) · 전체 -->
          <div class="pf-pick-row">
            <div class="pf-pick-tile"><div class="pf-pick-box is-wide"><button type="button" class="pf-zone" data-slot="top"></button><button type="button" class="pf-zone" data-slot="bottom"></button></div><span data-i18n="pickWide"></span></div>
            <div class="pf-pick-tile"><div class="pf-pick-box is-tall"><button type="button" class="pf-zone" data-slot="left"></button><button type="button" class="pf-zone" data-slot="right"></button></div><span data-i18n="pickTall"></span></div>
            <div class="pf-pick-tile"><div class="pf-pick-box"><button type="button" class="pf-zone" data-slot="full"></button></div><span data-i18n="pickFull"></span></div>
          </div>
          <button type="button" class="pf-pick-remove" id="pfPickRemove" data-i18n="pickRemove" hidden></button>
          <p class="pf-pick-sub" data-i18n="pickSub"></p>
        </div>
      </div>
      <!-- 프로필 수정: 소개 · 분야 · 경력 · 관심 태그 -->
      <div class="pf-edit" id="pfEdit" role="dialog" aria-modal="true" aria-labelledby="pfEditTitle" hidden>
        <form class="pf-edit-in" id="pfEditForm" novalidate>
          <h2 class="pf-edit-title" id="pfEditTitle" data-i18n="eTitle"></h2>
          <label class="pf-e-row"><span class="pf-e-label"><span data-i18n="eHeadline"></span><small class="pf-e-count" data-for="headline"></small></span>
            <input name="headline" maxlength="60" autocomplete="off" data-i18n-ph="eHeadlinePh"></label>
          <label class="pf-e-row"><span class="pf-e-label"><span data-i18n="eBio"></span><small class="pf-e-count" data-for="bio"></small></span>
            <textarea name="bio" maxlength="500" rows="4" data-i18n-ph="eBioPh"></textarea></label>
          <div class="pf-e-two">
            <label class="pf-e-row"><span class="pf-e-label"><span data-i18n="eField"></span><small class="pf-e-count" data-for="field"></small></span>
              <input name="field" maxlength="30" autocomplete="off" data-i18n-ph="eFieldPh"></label>
            <label class="pf-e-row"><span class="pf-e-label"><span data-i18n="eCareer"></span></span>
              <span class="pf-e-unit"><input name="career" type="text" inputmode="numeric" maxlength="2" autocomplete="off" data-i18n-ph="eCareerPh"><em data-i18n="eYears"></em></span></label>
          </div>
          <label class="pf-e-row"><span class="pf-e-label"><span data-i18n="eTags"></span><small class="pf-e-count" id="pfEditTagCount"></small></span>
            <input name="tags" autocomplete="off" data-i18n-ph="eTagsPh"></label>
          <p class="pf-e-msg" id="pfEditMsg" role="status"></p>
          <div class="pf-e-actions">
            <button type="button" class="pf-e-btn" id="pfEditCancel" data-i18n="eCancel"></button>
            <button type="submit" class="pf-e-btn is-main" id="pfEditSave" data-i18n="eSave"></button>
          </div>
        </form>
      </div>
      <p class="pf-layout-msg" id="pfLayoutMsg" role="status"></p>
    </div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="profile.js?v=202611191900"></script>
</body>
</html>
